name: EventHub Postman API Automation

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  postman-tests:
    name: Postman API Tests
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Create reports directory
      # --------------------------------------------------
      - name: Create reports directory
        run: |
          mkdir -p reports/functional
          mkdir -p reports/e2e
          mkdir -p reports/data-driven
          
      - name: Inspect EVENTHUB_BASE_URL
        shell: bash
        run: |
          printf 'VALUE=<%s>\n' '${{ vars.EVENTHUB_BASE_URL }}'
          printf 'LENGTH=%s\n' '${{ vars.EVENTHUB_BASE_URL }}' | wc -c
          printf 'BYTES:\n'
          printf '%s' '${{ vars.EVENTHUB_BASE_URL }}' | od -An -t x1
          
      - name: Verify CI variables
        run: |
          echo "EVENTHUB_BASE_URL=${{ vars.EVENTHUB_BASE_URL }}"
          echo "EVENTHUB_USER_ID=${{ vars.EVENTHUB_USER_ID }}"
          echo "EVENTHUB_EMAIL is configured: ${{ secrets.EVENTHUB_EMAIL != '' }}"
          echo "EVENTHUB_PASSWORD is configured: ${{ secrets.EVENTHUB_PASSWORD != '' }}"
          echo "POSTMAN_API_KEY is configured: ${{ secrets.POSTMAN_API_KEY != '' }}"
          
      # --------------------------------------------------
      # 3. EventHubAPI - Functional Collection
      # --------------------------------------------------
      - name: Run Functional Collection
        id: functional
        continue-on-error: true
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          command: >
            collection run postman/collections/functional.postman_collection.json
            --env-var "base_url=https://api.eventhub.rahulshettyacademy.com/api"
            --env-var "userName=${{ secrets.EVENTHUB_EMAIL }}"
            --env-var "userPassword=${{ secrets.EVENTHUB_PASSWORD }}"
            --env-var "userID=${{ vars.EVENTHUB_USER_ID }}"
            --env-var "expiredToken=${{ secrets.EVENTHUB_EXPIRED_TOKEN }}"
            --reporters cli,junit,json,html
            --reporter-junit-export reports/functional/postman-functional-junit-report.xml
            --reporter-json-export reports/functional/postman-functional-json-report.json
            --reporter-html-export reports/functional/postman-functional-html-report.html

      # --------------------------------------------------
      # 4. EventHubAPI - E2E Collection
      # --------------------------------------------------
      - name: Run E2E Collection
        id: e2e
        continue-on-error: true
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          command: >
            collection run postman/collections/e2e.postman_collection.json
            --env-var "base_url=https://api.eventhub.rahulshettyacademy.com/api"
            --env-var "userName=${{ secrets.EVENTHUB_EMAIL }}"
            --env-var "userPassword=${{ secrets.EVENTHUB_PASSWORD }}"
            --env-var "userID=${{ vars.EVENTHUB_USER_ID }}"
            --reporters cli,junit,json,html
            --reporter-junit-export reports/e2e/postman-e2e-junit-report.xml
            --reporter-json-export reports/e2e/postman-e2e-json-report.json
            --reporter-html-export reports/e2e/postman-e2e-html-report.html

      # --------------------------------------------------
      # 5. EventHubAPI - Data-Driven Collection
      # --------------------------------------------------
      - name: Run Data-Driven Collection
        id: datadriven
        continue-on-error: true
        uses: postmanlabs/postman-cli-action@v1
        with:
          api-key: ${{ secrets.POSTMAN_API_KEY }}
          command: >
            collection run postman/collections/datadriven.postman_collection.json
            --env-var "base_url=https://api.eventhub.rahulshettyacademy.com/api"
            --env-var "userName=${{ secrets.EVENTHUB_EMAIL }}"
            --env-var "userPassword=${{ secrets.EVENTHUB_PASSWORD }}"
            --env-var "userID=${{ vars.EVENTHUB_USER_ID }}"
            --iteration-data test-data/eventData.csv
            --reporters cli,junit,json,html
            --reporter-junit-export reports/data-driven/postman-ddt-junit-report.xml
            --reporter-json-export reports/data-driven/postman-ddt-json-report.json
            --reporter-html-export reports/data-driven/postman-ddt-html-report.html

      # --------------------------------------------------
      # 6. Show summary in GitHub Actions
      # --------------------------------------------------
      - name: Postman Test Summary
        if: always()
        run: |
          echo "========================================"
          echo "       POSTMAN TEST EXECUTION"
          echo "========================================"

          echo ""
          echo "Functional Collection:"
          echo "  Outcome: ${{ steps.functional.outcome }}"

          echo ""
          echo "E2E Collection:"
          echo "  Outcome: ${{ steps.e2e.outcome }}"

          echo ""
          echo "Data-Driven Collection:"
          echo "  Outcome: ${{ steps.datadriven.outcome }}"

          echo ""
          echo "Known application defects may appear"
          echo "as FAILED tests and are documented using BUG IDs."
          echo ""
          echo "Reports are available in the workflow artifact."

      # --------------------------------------------------
      # 7. Upload reports even if tests failed
      # --------------------------------------------------
      - name: Upload Postman Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-reports
          path: reports/
          if-no-files-found: warn
